// ─── COUNTDOWN ───────────────────────────────────────────────────────────────
function useCountdown() {
  const [time, setTime] = React.useState(() => {
    const stored = localStorage.getItem('mir_countdown_end');
    if (stored) return Math.max(0, parseInt(stored) - Date.now());
    const end = Date.now() + 23 * 3600000 + 47 * 60000 + 33000;
    localStorage.setItem('mir_countdown_end', end);
    return end - Date.now();
  });
  React.useEffect(() => {
    const t = setInterval(() => setTime(prev => Math.max(0, prev - 1000)), 1000);
    return () => clearInterval(t);
  }, []);
  const h = Math.floor(time / 3600000).toString().padStart(2,'0');
  const m = Math.floor((time % 3600000) / 60000).toString().padStart(2,'0');
  const s = Math.floor((time % 60000) / 1000).toString().padStart(2,'0');
  return { h, m, s };
}

            style={{ width:'100%', height:36, borderRadius:6, border:'none', cursor:'pointer', marginBottom:12 }}
          />
          <label style={{ display:'flex', alignItems:'center', gap:8, fontSize:12, color:'rgba(255,255,255,0.6)', cursor:'pointer' }}>
            <input type="checkbox" defaultChecked={tweaks.darkBg}
              onChange={e => {
                tweaks.darkBg = e.target.checked;
                window.parent.postMessage({type:'__edit_mode_set_keys', edits:{darkBg:e.target.checked}},'*');
              }}
            />
            Dark Background
          </label>
        </div>
      )}
    </div>
  );
}

ReactDOM.createRoot(document.getElementById('root')).render(<App />);
</script>
</body>
</html>
