// ── RESPONSIVE HOOK ───────────────────────────────────────────────────────────
function useWindowWidth() {
  const [width, setWidth] = React.useState(
    typeof window !== 'undefined' ? window.innerWidth : 1200
  );
  React.useEffect(() => {
    const handler = () => setWidth(window.innerWidth);
    window.addEventListener('resize', handler);
    return () => window.removeEventListener('resize', handler);
  }, []);
  return width;
}

// ── NAV ──────────────────────────────────────────────────────────────────────
function Nav({ active, setActive }) {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const [menuOpen, setMenuOpen] = React.useState(false);
  const items = ['Intro', 'How It Works', 'Results', 'Pricing', 'Join'];

  React.useEffect(() => {
    if (!isMobile) setMenuOpen(false);
  }, [isMobile]);

  React.useEffect(() => {
    document.body.style.overflow = menuOpen ? 'hidden' : '';
    return () => { document.body.style.overflow = ''; };
  }, [menuOpen]);

  const scrollTo = (item) => {
    const id = item === 'Results' ? 'about-us'
             : item === 'How It Works' ? 'how-it-works'
             : item.toLowerCase().replace(/ /g, '-');
    document.getElementById(id)?.scrollIntoView({ behavior: 'smooth', block: 'start' });
  };

  const handleNavClick = (e, item) => {
    e.preventDefault();
    setActive(item);
    setMenuOpen(false);
    scrollTo(item);
  };

  if (isMobile) {
    return (
      <>
        <nav style={{
          position: 'fixed', top: 0, left: 0, right: 0, zIndex: 200,
          display: 'flex', alignItems: 'center', justifyContent: 'space-between',
          padding: '14px 20px',
          background: 'rgba(232,232,227,0.96)',
          backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)',
          borderBottom: '1px solid rgba(0,0,0,0.07)'

          <img src="assets/mir-logo-header.png" alt="MIR" style={{ height: 44, width: 'auto', display: 'block' }} />
          <button
            aria-label={menuOpen ? 'Close menu' : 'Open menu'}
            onClick={() => setMenuOpen(!menuOpen)}
            style={{
              background: menuOpen ? '#0a0a0a' : 'rgba(255,255,255,0.7)',
              border: '1.5px solid rgba(0,0,0,0.15)', borderRadius: 10,
              width: 44, height: 44, cursor: 'pointer', flexShrink: 0,
              display: 'flex', flexDirection: 'column', alignItems: 'center',
              justifyContent: 'center', gap: 5, transition: 'background 0.2s'
            }}>
            <span style={{ display: 'block', width: 18, height: 2, background: menuOpen ? '#fff' : '#0a0a0a', borderRadius: 2, transition: 'transform 0.25s, background 0.2s', transform: menuOpen ? 'rotate(45deg) translate(0px, 7px)' : 'none' }} />
            <span style={{ display: 'block', width: 18, height: 2, background: menuOpen ? '#fff' : '#0a0a0a', borderRadius: 2, transition: 'opacity 0.2s, background 0.2s', opacity: menuOpen ? 0 : 1 }} />
            <span style={{ display: 'block', width: 18, height: 2, background: menuOpen ? '#fff' : '#0a0a0a', borderRadius: 2, transition: 'transform 0.25s, background 0.2s', transform: menuOpen ? 'rotate(-45deg) translate(0px, -7px)' : 'none' }} />
          </button>
        </nav>
        <div style={{
          position: 'fixed', top: 73, left: 0, right: 0, bottom: 0, zIndex: 199,
          background: 'rgba(232,232,227,0.98)',
          backdropFilter: 'blur(16px)', WebkitBackdropFilter: 'blur(16px)',
          padding: '20px 20px 40px',
          display: 'flex', flexDirection: 'column', gap: 6,
          pointerEvents: menuOpen ? 'all' : 'none',
          opacity: menuOpen ? 1 : 0,
          transform: menuOpen ? 'translateY(0)' : 'translateY(-8px)',
          transition: 'opacity 0.25s, transform 0.25s',
          overflowY: 'auto'
        }}>
          {items.map((item) => (
            <a key={item}
              href={`#${item.toLowerCase().replace(/ /g, '-')}`}
              onClick={(e) => handleNavClick(e, item)}
              style={{
                padding: '16px 20px', borderRadius: 14,
                fontSize: 17, fontWeight: 600,
                color: active === item ? '#0a0a0a' : '#555',
                background: active === item ? '#fff' : 'transparent',
                boxShadow: active === item ? '0 2px 12px rgba(0,0,0,0.08)' : 'none',

                display: 'block', minHeight: 52

            </a>
          ))}
          <button style={{
            background: '#0a0a0a', color: '#fff', border: 'none', borderRadius: 14,
            padding: '16px 24px', fontSize: 15, fontWeight: 700, cursor: 'pointer',
            marginTop: 8, minHeight: 52
          }}
            onClick={() => { setMenuOpen(false); window.scrollTo({ top: 0, behavior: 'smooth' }); }}>
            Home
          </button>
        </div>
      </>
    );
  }

  return (
    <nav style={{
      position: 'fixed', top: 0, left: 0, right: 0, zIndex: 100,
      display: 'flex', alignItems: 'center', justifyContent: 'space-between',
      padding: '18px 48px',
      background: 'rgba(232,232,227,0.88)',
      backdropFilter: 'blur(12px)', WebkitBackdropFilter: 'blur(12px)'
    }}>
      <img src="assets/mir-logo-header.png" alt="MIR" style={{ height: 80, width: 'auto', display: 'block' }} />
      <div style={{
        display: 'flex', alignItems: 'center', gap: 4,
        background: 'rgba(255,255,255,0.6)',
        border: '1px solid rgba(0,0,0,0.08)',
        borderRadius: 100, padding: '6px 8px'
      }}>
        {items.map((item) =>
          <a key={item}
            href={`#${item.toLowerCase().replace(/ /g, '-')}`}
            onClick={(e) => { e.preventDefault(); setActive(item); scrollTo(item); }}
            style={{
              padding: '7px 18px', borderRadius: 100,
              fontSize: 14, fontWeight: 500,
              color: active === item ? '#0a0a0a' : '#666',
              background: active === item ? '#fff' : 'transparent',
              boxShadow: active === item ? '0 1px 6px rgba(0,0,0,0.1)' : 'none',
              textDecoration: 'none', transition: 'all 0.2s', cursor: 'pointer'
            }}>
            {item}
          </a>
        )}
      </div>
      <button style={{
        background: '#0a0a0a', color: '#fff', border: 'none', borderRadius: 100,
        padding: '10px 24px', fontSize: 14, fontWeight: 600, cursor: 'pointer',
        transition: 'background 0.15s'
      }}
        onMouseEnter={(e) => e.target.style.background = '#333'}
        onMouseLeave={(e) => e.target.style.background = '#0a0a0a'}
        onClick={() => window.scrollTo({ top: 0, behavior: 'smooth' })}>Home
      </button>
    </nav>
  );
}

// ── TRADING CALENDAR ─────────────────────────────────────────────────────────
function TradingCalendar() {
  const width = useWindowWidth();
  const isMobile = width < 768;
  const isSmallMobile = width < 420;

  const days = isMobile
    ? ['S', 'M', 'T', 'W', 'T', 'F', 'S']
    : ['SUN', 'MON', 'TUE', 'WED', 'THU', 'FRI', 'SAT'];
  const startOffset = 3;
  const totalDays = 30;

  const trades = {
    1: { amount: -104.50, pct: 57, positive: false },
    6: { amount: 511.50, pct: 50, positive: true },
    13: { amount: -68.00, pct: 27, positive: false },
    14: { amount: 1705.50, pct: 40, positive: true },
    15: { amount: 315.00, pct: 67, positive: true },
    16: { amount: -290.00, pct: 50, positive: false },
    17: { amount: 158.50, pct: 50, positive: true },
    20: { amount: 480.00, pct: 67, positive: true },
    21: { amount: -785.00, pct: 38, positive: false },
    23: { amount: 597.50, pct: 50, positive: true },
    24: { amount: 379.50, pct: 0, positive: true }
  };

  const cells = [];
  for (let i = 0; i < 6 * 7; i++) {
    const dayNum = i - startOffset + 1;
    cells.push(dayNum >= 1 && dayNum <= totalDays ? dayNum : null);
  }

  const cellH = isSmallMobile ? 58 : isMobile ? 68 : 88;
  const cellPad = isMobile ? '6px 3px' : '10px 12px';
  const amtSize = isSmallMobile ? 10 : isMobile ? 12 : 15;
  const daySize = isMobile ? 9 : 12;
  const pctSize = isMobile ? 9 : 11;

  return (
    <div style={{ background: '#111', borderRadius: 16, overflow: 'hidden', border: '1px solid rgba(255,255,255,0.06)' }}>
      <div style={{ display: 'flex', alignItems: 'center', justifyContent: 'space-between', padding: isMobile ? '12px 14px' : '14px 20px', borderBottom: '1px solid rgba(255,255,255,0.06)', flexWrap: 'wrap', gap: 8 }}>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <span style={{ fontSize: isMobile ? 13 : 15, fontWeight: 700, color: '#e8e8e3' }}>Trading Calendar</span>
          <div style={{ display: 'flex', gap: 4 }}>
            <span style={{ background: '#22c55e', color: '#fff', fontSize: 11, fontWeight: 700, padding: '4px 10px', borderRadius: 6 }}>PNL</span>
            <span style={{ background: 'rgba(255,255,255,0.08)', color: '#888', fontSize: 11, fontWeight: 600, padding: '4px 10px', borderRadius: 6 }}>Events</span>
          </div>
        </div>
        <div style={{ display: 'flex', alignItems: 'center', gap: 10 }}>
          <button style={{ background: 'rgba(255,255,255,0.08)', border: 'none', color: '#888', width: 32, height: 32, borderRadius: 6, cursor: 'pointer', fontSize: 14, minWidth: 32 }}>←</button>
          <span style={{ fontSize: isMobile ? 12 : 14, fontWeight: 600, color: '#e8e8e3' }}>April 2026</span>
          <button style={{ background: 'rgba(255,255,255,0.08)', border: 'none', color: '#888', width: 32, height: 32, borderRadius: 6, cursor: 'pointer', fontSize: 14, minWidth: 32 }}>→</button>
        </div>
      </div>
      <div style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', borderBottom: '1px solid rgba(255,255,255,0.06)' }}>
        {days.map((d) =>
          <div key={d} style={{ padding: isMobile ? '8px 0' : '12px 0', textAlign: 'center', fontSize: isMobile ? 10 : 11, fontWeight: 700, letterSpacing: isMobile ? '0' : '0.1em', color: '#555' }}>{d}</div>
        )}
      </div>
      {[0, 1, 2, 3, 4, 5].map((row) =>
        <div key={row} style={{ display: 'grid', gridTemplateColumns: 'repeat(7,1fr)', borderBottom: row < 5 ? '1px solid rgba(255,255,255,0.04)' : 'none' }}>
          {cells.slice(row * 7, row * 7 + 7).map((dayNum, ci) => {
            const trade = dayNum ? trades[dayNum] : null;
            return (
              <div key={ci} style={{
                minHeight: cellH,
                borderRight: ci < 6 ? '1px solid rgba(255,255,255,0.04)' : 'none',
                padding: cellPad,
                background: trade ? trade.positive ? 'rgba(22,101,52,0.4)' : 'rgba(127,29,29,0.4)' : 'transparent',
                outline: trade ? `1px solid ${trade.positive ? 'rgba(34,197,94,0.35)' : 'rgba(239,68,68,0.35)'}` : 'none',
                outlineOffset: '-2px',
                display: 'flex', flexDirection: 'column'
              }}>
                {dayNum &&
                  <>
                    <span style={{ fontSize: daySize, fontWeight: 500, color: trade ? '#e8e8e3' : '#555', marginBottom: trade ? 3 : 0 }}>{dayNum}</span>
                    {trade &&
                      <>
                        <span style={{ fontSize: amtSize, fontWeight: 700, color: trade.positive ? '#4ade80' : '#f87171', lineHeight: 1.2 }}>
                          {trade.amount < 0 ? `-$${Math.abs(trade.amount).toFixed(2)}` : `$${trade.amount.toFixed(2)}`}
                        </span>
                        {!isSmallMobile && (
                          <span style={{ fontSize: pctSize, color: trade.positive ? '#4ade80' : '#f87171', marginTop: 2, opacity: 0.8 }}>{trade.pct}%</span>
                        )}
                      </>
                    }
                  </>
                }
              </div>
            );
          })}
        </div>
      )}
    </div>
  );
}

// ── IMAGE SLIDESHOW ───────────────────────────────────────────────────────────
function Slideshow() {
  const images = ['assets/Q4.png', 'assets/Q1.png', 'assets/Q2.jpg', 'assets/Q3.png'];
  const [current, setCurrent] = React.useState(0);
  const [fading, setFading] = React.useState(false);
  const width = useWindowWidth();
  const isMobile = width < 768;

  React.useEffect(() => {
    const t = setInterval(() => {
      setFading(true);
      setTimeout(() => { setCurrent((c) => (c + 1) % images.length); setFading(false); }, 400);
    }, 3500);
    return () => clearInterval(t);
  }, []);

  const go = (dir) => {
    setFading(true);
    setTimeout(() => { setCurrent((c) => (c + dir + images.length) % images.length); setFading(false); }, 300);
  };

  return (
    <div style={{ position: 'relative', borderRadius: 16, overflow: 'hidden', background: '#111' }}>
      <img src={images[current]} style={{ width: '100%', height: isMobile ? 260 : 480, objectFit: 'contain', background: '#111', opacity: fading ? 0 : 1, transition: 'opacity 0.4s ease', display: 'block' }} />
